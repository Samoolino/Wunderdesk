name: Paper agent checks
on:
  pull_request:
  push:
    branches: [main, feat/vercel-paper-agent]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
